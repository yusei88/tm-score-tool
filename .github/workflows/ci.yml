name: CI

on:
    push:
        branches: [main, 001-tm-session-management]
    pull_request:
        branches: [main]

jobs:
    test-and-validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "yarn"
                  # point cache lookup to backend lockfile since this repo keeps dependencies there
                  cache-dependency-path: backend/yarn.lock

            - name: Enable Corepack and prepare Yarn 4
              run: |
                  corepack enable
                  # Use Yarn 4 (berry) to match developer environment; adjust version if needed
                  corepack prepare yarn@4.11.0 --activate

            - name: Install backend dependencies
              run: |
                  cd backend
                  # Use immutable install for Yarn 4; will fail if lockfile and cache are out of sync
                  yarn install --immutable --immutable-cache

            - name: Run backend tests
              run: |
                  cd backend
                  yarn test

            - name: Validate OpenAPI contract
              run: |
                  npx @apidevtools/swagger-cli validate specs/001-tm-session-management/contracts/openapi.yaml

            - name: Run dependency audit (moderate level, non-blocking)
              continue-on-error: true
              run: |
                  cd backend
                  yarn audit --level moderate || true
