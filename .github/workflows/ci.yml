name: CI

on:
  push:
    branches: [ main, 001-tm-session-management ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Validate OpenAPI contract
        run: |
          npx @apidevtools/swagger-cli validate specs/001-tm-session-management/contracts/openapi.yaml

      - name: Run npm audit (moderate level, non-blocking)
        continue-on-error: true
        run: |
          cd backend
          npm audit --audit-level=moderate || true
