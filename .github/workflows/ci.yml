name: CI

on:
    push:
        branches: [main, 001-tm-session-management]
    # pull_request:
    #     branches: [main]

jobs:
    test-and-validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"

            - name: Cache Yarn cache
              uses: actions/cache@v4
              with:
                  path: |
                      backend/.yarn/cache
                      backend/.yarn/install-state.gz
                      ~/.cache/yarn
                  key: ${{ runner.os }}-yarn-${{ hashFiles('backend/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install backend dependencies
              run: |
                  cd backend
                  yarn install

            - name: Run backend tests
              run: |
                  cd backend
                  yarn test

            - name: Validate OpenAPI contract
              run: |
                  npx @apidevtools/swagger-cli validate specs/001-tm-session-management/contracts/openapi.yaml

            - name: Run dependency audit (moderate level, non-blocking)
              continue-on-error: true
              run: |
                  cd backend
                  yarn audit --level moderate || true
